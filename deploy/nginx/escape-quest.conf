# À copier dans /etc/nginx/sites-available/escape-quest
# puis : ln -s /etc/nginx/sites-available/escape-quest /etc/nginx/sites-enabled/
#        rm /etc/nginx/sites-enabled/default
#        nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    root /var/www/escape-quest/front/dist;
    index index.html;

    # Front React (routes gérées par React)
    location / {
        try_files $uri /index.html;
    }

    # API Symfony
    location /api {
        root /var/www/escape-quest/api/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/escape-quest/api/public;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adapter à la version de PHP installée
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    access_log /var/log/nginx/escape-access.log;
    error_log  /var/log/nginx/escape-error.log;
}
